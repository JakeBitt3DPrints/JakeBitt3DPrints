  <title>Contact | JakeBitt3DPrints</title>

  <!-- Link previews (Facebook, iMessage, Discord, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JakeBitt3DPrints" />
  <meta property="og:title" content="Contact | JakeBitt3DPrints" />
  <meta property="og:description" content="Get in touch with JakeBitt3DPrints for custom 3D printing projects, quotes, or questions." />
  <meta property="og:url" content="https://jakebitt3dprints.com/contact" />
  <meta property="og:image" content="https://raw.githubusercontent.com/JakeBitt3DPrints/JakeBitt3DPrints/refs/heads/main/jbprintslogotransparentsmall.png" />

  <!-- Browser UI colour (mobile address bar); updated by the theme script -->
  <meta name="theme-color" id="themeColor" content="#f5f5f5" />

  <!-- THEME: inline bg on html before any paint — eliminates white flash -->
  <style>html { background: #f5f5f5; } html[data-theme="dark"] { background: #111827; }</style>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeColor').setAttribute('content', '#111827');
        }
      } catch(e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ── TOKENS ── */
    :root {
      color-scheme: light;
      --bg:          #f5f5f5;
      --bg-alt:      #ffffff;
      --text:        #111111;
      --muted:       #4b5563;
      --accent:      #2563eb;
      --border:      #e5e7eb;
      --nav-bg:      #ffffff;
      --nav-text:    #111111;
      --nav-active-bg:   #111111;
      --nav-active-text: #ffffff;
      --footer-bg:   #ffffff;
      --shadow:      0 10px 25px rgba(15,23,42,0.08);
      --radius:      20px;
      --font-head:   'DM Serif Display', Georgia, serif;
      --font-body:   'DM Sans', system-ui, sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left,   0px);
      --safe-r: env(safe-area-inset-right,  0px);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg:          #111827;
      --bg-alt:      #020617;
      --text:        #f9fafb;
      --muted:       #d1d5db;
      --accent:      #9ca3af;
      --border:      #1f2937;
      --nav-bg:      #020617;
      --nav-text:    #e5e7eb;
      --nav-active-bg:   #e5e7eb;
      --nav-active-text: #020617;
      --footer-bg:   #020617;
      --shadow:      0 10px 25px rgba(0,0,0,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; overflow-x: clip; max-width: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden; overflow-x: clip;
      max-width: 100%;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button, a, [role="button"] { touch-action: manipulation; }

    /* ── PAGE FADE TRANSITION ── */
    /* Cross-page View Transitions (Chrome/Edge 126+, Safari 18.2+) */
    @view-transition { navigation: auto; }
    @keyframes vt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes vt-fade-out { from { opacity: 1; } to { opacity: 0; } }
    ::view-transition-old(root) { animation: vt-fade-out 0.22s ease forwards; }
    ::view-transition-new(root) { animation: vt-fade-in 0.28s ease forwards; }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .site-shell { animation: pageFadeIn 0.45s cubic-bezier(0.4,0,0.2,1) both; }

    /* ── ENTRANCE ANIMATIONS ── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate { animation: slideUp 0.45s cubic-bezier(0.4,0,0.2,1) both; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.19s; }

    /* ── LAYOUT SHELL ── */
    .site-shell {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 24px calc(20px + var(--safe-r)) 32px calc(20px + var(--safe-l));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── BRAND BAR ── */
    .brand-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .brand-left { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .brand-logo {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; background: var(--bg-alt);
      overflow: hidden; padding: 4px; flex-shrink: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .brand-logo img { width: 100%; height: 100%; object-fit: contain; filter: invert(0); transition: filter 0.3s ease; }
    :root[data-theme="dark"] .brand-logo img { filter: invert(1); }
    .brand-text { display: flex; flex-direction: column; gap: 2px; }
    .brand-name { font-weight: 700; font-size: 1.05rem; color: var(--text); }
    .brand-tagline { font-size: 0.82rem; color: var(--muted); line-height: 1.3; }

    /* ── NAV ── */
    .nav-wrap { flex-shrink: 0; }
    nav {
      display: flex; align-items: center; gap: 4px; padding: 5px 8px;
      border-radius: 999px; background: var(--nav-bg); border: 1px solid var(--border);
      box-shadow: var(--shadow);
      /* Scroll internally, never leak to page */
      overflow-x: auto; overflow-y: visible;
      scrollbar-width: none; -ms-overflow-style: none;
      max-width: 100%;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      text-decoration: none; font-size: 0.88rem; font-weight: 600;
      padding: 7px 14px; border-radius: 999px; color: var(--nav-text);
      white-space: nowrap; flex-shrink: 0;
      transition: background-color 0.22s ease, color 0.22s ease, transform 0.12s ease;
    }
    nav a:hover:not(.active) { background-color: rgba(148,163,184,0.16); }
    nav a:active { transform: scale(0.95); }
    nav a.active { background-color: var(--nav-active-bg); color: var(--nav-active-text); }

    /* ── CARD ── */
    .page-card {
      border-radius: var(--radius); background: var(--bg-alt); border: 1px solid var(--border);
      box-shadow: var(--shadow); padding: 32px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .eyebrow {
      font-size: 0.74rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin-bottom: 10px;
    }
    .page-title {
      font-family: var(--font-head); font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.2; margin-bottom: 24px; color: var(--text);
    }

    /* ── CONTACT FORM ── */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-row-full { grid-column: 1 / -1; }
    .form-label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .form-input, .form-textarea {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px;
      font-size: 1rem; font-family: var(--font-body); background: var(--bg); color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease; outline: none;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .form-textarea { min-height: 140px; resize: vertical; }

    .btn-primary {
      background-color: var(--accent); color: #ffffff; border: 1px solid var(--accent);
      padding: 12px 28px; font-size: 0.95rem; font-weight: 600; border-radius: 999px;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-body);
      transition: opacity 0.18s ease, transform 0.12s ease;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.97); }
    :root[data-theme="dark"] .btn-primary { background-color: #4b5563; border-color: #4b5563; }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .form-status { margin-top: 14px; font-size: 0.9rem; line-height: 1.5; }
    .form-status:empty { display: none; }
    .form-status.ok  { color: #16a34a; }
    .form-status.err { color: #dc2626; }
    :root[data-theme="dark"] .form-status.ok  { color: #4ade80; }
    :root[data-theme="dark"] .form-status.err { color: #f87171; }
    .form-status a { color: inherit; font-weight: 600; }

    .alt-contact { margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--border); }
    .alt-contact h3 { font-family: var(--font-head); font-size: 1.3rem; margin-bottom: 12px; }
    .alt-contact p { color: var(--muted); line-height: 1.6; }

    /* ── FOOTER ── */
    footer {
      width: 100%;
      background-color: var(--footer-bg); border-top: 1px solid var(--border);
      padding: 16px calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) calc(20px + var(--safe-l));
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .footer-inner {
      max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap;
      align-items: center; gap: 14px; justify-content: space-between;
    }
    .footer-left { font-size: 0.82rem; color: var(--muted); }
    .footer-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .social-links { display: flex; align-items: center; gap: 6px; }
    .social-links a {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); text-decoration: none;
      font-size: 1rem; color: var(--muted);
      transition: background-color 0.15s ease, transform 0.12s ease, border-color 0.15s ease;
    }
    .social-links a:hover { background-color: rgba(148,163,184,0.18); transform: translateY(-1px); }
    .social-links a:active { transform: scale(0.92); }
    .social-links a.facebook { color: #1877f2; }
    .social-links a.youtube  { color: #ff0000; }
    .social-links a.instagram i {
      background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .social-links a.tiktok i {
      background: linear-gradient(45deg,#25f4ee,#fe2c55);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .social-links a.snapchat { background-color: #fffc00; border-color: #fffc00; color: #000; }
    .social-links a.snapchat:hover { background-color: #facc15; }

    .theme-btn {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px; border: 1px solid var(--border);
      padding: 6px 13px; font-size: 0.8rem; color: var(--muted);
      cursor: pointer; background: transparent;
      font-family: var(--font-body); min-height: 36px;
      transition: background-color 0.15s ease, transform 0.12s ease, border-color 0.3s ease;
    }
    .theme-btn:hover { background-color: rgba(148,163,184,0.18); transform: translateY(-1px); }
    .theme-btn:active { transform: scale(0.95); }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .brand-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .nav-wrap { width: 100%; }
      nav { width: 100%; justify-content: space-between; }
      nav a { padding: 7px 10px; font-size: 0.82rem; }
      .contact-grid { grid-template-columns: 1fr; }
      .page-card { padding: 24px 20px; }
      .footer-inner { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
    @media (max-width: 400px) {
      nav a { padding: 6px 8px; font-size: 0.78rem; }
    }

    /* ── REDUCED MOTION ── (only affects people who turned this on in their OS) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }
      ::view-transition-group(*),
      ::view-transition-old(*),
      ::view-transition-new(*) { animation: none !important; }
    }
  </style>
</head>

<body>
  <div class="site-shell">

    <header class="brand-bar animate d1">
      <a class="brand-left" href="/" aria-label="JakeBitt3DPrints home">
        <div class="brand-logo">
          <img src="https://raw.githubusercontent.com/JakeBitt3DPrints/JakeBitt3DPrints/refs/heads/main/jbprintslogotransparentsmall.png" alt="" width="34" height="34" decoding="async">
        </div>
        <div class="brand-text">

          <div class="brand-tagline">Bringing your imagination to life, one layer at a time.</div>
        </div>

    <main class="page-card animate d2">

      <form action="https://api.web3forms.com/submit" method="POST" class="contact-form" id="contactForm">
        <input type="hidden" name="access_key" value="a8d930c0-d1fe-423a-840f-35cae1bd0bbb">
        <input type="hidden" name="subject" value="New message from jakebitt3dprints.com">
        <input type="hidden" name="from_name" value="JakeBitt3DPrints website">
        <!-- Spam trap: hidden from people, bots tick it and get filtered out -->
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

        <div class="contact-grid">

            <label for="name" class="form-label">Full Name</label>

          Email: <a href="mailto:contact@jakebitt3dprints.com" style="color: var(--accent); text-decoration: none; font-weight: 500;">contact@jakebitt3dprints.com</a><br>
          Check our <a href="/calendar" style="color: var(--accent); text-decoration: none; font-weight: 500;">calendar</a> for availability.
        </p>
      </div>

  </div>

  <footer>
    <div class="footer-inner animate d3">
      <div class="footer-left">&copy; <span id="year">2026</span> JakeBitt3DPrints. All rights reserved.</div>
      <div class="footer-right">
        <div class="social-links" aria-label="Social media links">
          <a href="https://www.facebook.com/61579251184929/" target="_blank" rel="noopener" class="facebook" aria-label="Facebook"><i class="fab fa-facebook" aria-hidden="true"></i></a>
          <a href="https://www.instagram.com/jakebitt3dprints/" target="_blank" rel="noopener" class="instagram" aria-label="Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
          <a href="https://www.youtube.com/@JakeBitt3DPrints" target="_blank" rel="noopener" class="youtube" aria-label="YouTube"><i class="fab fa-youtube" aria-hidden="true"></i></a>
          <a href="https://www.tiktok.com/@jakebitt3dprints" target="_blank" rel="noopener" class="tiktok" aria-label="TikTok"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
          <a href="https://www.snapchat.com/@jakebitt3dprint" target="_blank" rel="noopener" class="snapchat" aria-label="Snapchat"><i class="fab fa-snapchat" aria-hidden="true"></i></a>
        </div>
        <button type="button" class="theme-btn" id="themeToggle">
          <span id="themeIcon" aria-hidden="true">🌙</span>
          <span id="themeLabel">Dark mode</span>
        </button>
      </div>
    </div>
  </footer>

  <script>
  (function() {

    /* ── FOOTER YEAR ── */
    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    /* ── THEME TOGGLE ── */
    var root      = document.documentElement;
    var toggle    = document.getElementById('themeToggle');
    var tIcon     = document.getElementById('themeIcon');
    var tLabel    = document.getElementById('themeLabel');
    var metaColor = document.getElementById('themeColor');

    function getStoredTheme() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
    function setStoredTheme(v) { try { localStorage.setItem('theme', v); } catch (e) {} }

    function syncTheme() {
      var dark = root.getAttribute('data-theme') === 'dark';
      tIcon.textContent  = dark ? '☀️' : '🌙';
      tLabel.textContent = dark ? 'Light mode' : 'Dark mode';
      if (metaColor) metaColor.setAttribute('content', dark ? '#111827' : '#f5f5f5');
    }
    function applyTheme(dark) {
      if (dark) root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      syncTheme();
    }
    syncTheme();

    toggle.addEventListener('click', function() {
      var dark = root.getAttribute('data-theme') !== 'dark';
      applyTheme(dark);
      setStoredTheme(dark ? 'dark' : 'light');
    });

    // Follow the device's light/dark setting live, until the visitor picks one manually
    try {
      var themeMq = window.matchMedia('(prefers-color-scheme: dark)');
      var onSystemTheme = function(e) { if (!getStoredTheme()) applyTheme(e.matches); };
      if (themeMq.addEventListener) themeMq.addEventListener('change', onSystemTheme);
      else if (themeMq.addListener) themeMq.addListener(onSystemTheme);
    } catch (e) {}

    /* ── CONTACT FORM ── */
    // Sends in the background so visitors stay on the page and see a confirmation,
    // instead of being dropped onto Web3Forms' own page. Without JS the form still posts normally.
    var form = document.getElementById('contactForm');
    if (form && window.fetch && window.FormData) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var btn    = form.querySelector('button[type="submit"]');
        var label  = btn.querySelector('span');
        var status = document.getElementById('formStatus');
        btn.disabled = true;
        label.textContent = 'Sending…';
        status.className = 'form-status';
        status.textContent = '';

        var data = {};
        new FormData(form).forEach(function(v, k) { data[k] = v; });

        fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(function(r) {
          return r.json().catch(function() { return {}; }).then(function(j) {
            if (!r.ok || j.success === false) throw new Error(j.message || 'Send failed');
          });
        })
        .then(function() {
          form.reset();
          status.className = 'form-status ok';
          status.textContent = "Thanks! Your message was sent \u2014 I'll get back to you soon.";
        })
        .catch(function() {
          status.className = 'form-status err';
          status.innerHTML = 'Sorry, that didn\'t send. Please try again, or email ' +
            '<a href="mailto:contact@jakebitt3dprints.com">contact@jakebitt3dprints.com</a>.';
        })
        .finally(function() {
          btn.disabled = false;
          label.textContent = 'Send Message';
        });
      });
    }

    /* ── SMOOTH PAGE TRANSITIONS ── */
    // Browsers with cross-page View Transitions fade natively via the @view-transition CSS rule,
    // so this JS fallback only runs in browsers that don't have it.
    (function() {
      if ('CSSViewTransitionRule' in window) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      document.querySelectorAll('nav a, .brand-left, .alt-contact a').forEach(function(link) {
        link.addEventListener('click', function(e) {
          // Let Cmd/Ctrl/Shift/middle-click open new tabs/windows as normal
          if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          var href = link.getAttribute('href');
          if (!href || href.charAt(0) === '#' || href.indexOf('mailto:') === 0 || href.indexOf('tel:') === 0) return;
          if (link.target === '_blank') return;
          var url;
          try { url = new URL(href, window.location.href); } catch (err) { return; }
          if (url.origin !== window.location.origin) return;

          e.preventDefault();
          var shell  = document.querySelector('.site-shell');
          var footer = document.querySelector('footer');
          if (shell) {
            shell.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
            shell.style.opacity    = '0';
            shell.style.transform  = 'translateY(-8px)';
          }
          if (footer) {
            footer.style.transition = 'opacity 0.22s ease';
            footer.style.opacity    = '0';
          }
          setTimeout(function() { window.location.href = url.href; }, 230);
        });
      });

      // When the visitor hits Back, Safari/Firefox restore the page exactly as it was
      // (faded out). Undo the fade so the page isn't blank.
      window.addEventListener('pageshow', function(e) {
        if (!e.persisted) return;
        var shell  = document.querySelector('.site-shell');
        var footer = document.querySelector('footer');
        if (shell)  { shell.style.opacity = ''; shell.style.transform = ''; }
        if (footer) { footer.style.opacity = ''; }
      });
    })();
  })();
  </script>
</body>
</html>
